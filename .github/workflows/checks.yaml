---
name: Run Relevant Checks

on: [push]

jobs:
  acceptance:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    env:
      GOMODCACHE: ${{ github.workspace }}/.go-pkg-mod
      GOCACHE: ${{ github.workspace }}/.go-build-cache
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
      - name: Extract branch name
        shell: bash
        run: echo "branch=$(basename ${GITHUB_REF_NAME})" >> $GITHUB_OUTPUT
        id: extract_branch
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ steps.extract_branch.outputs.branch }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./.go-version
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.17.*'
          terraform_wrapper: false
      - run: make tools
      - run: make acctests
        env:
          TF_ACC: '1'
          TESTARGS: '-parallel=1 -run=TestAccContainerAppResource_regressionTest'
          SERVICE: 'containerapps'
          TESTTIMEOUT: '60m'
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_TEST_LOCATION: ${{ secrets.ARM_TEST_LOCATION }}
          ARM_TEST_LOCATION_ALT: ${{ secrets.ARM_TEST_LOCATION_ALT }}
          ARM_TEST_LOCATION_ALT2: ${{ secrets.ARM_TEST_LOCATION_ALT2 }}
          ARM_TEST_DNS_ZONE: gdesk.top
          ARM_TEST_DATA_RESOURCE_GROUP: dns-rg
  pr-check:
    name: PR checks
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
      - name: Extract branch name
        shell: bash
        run: echo "branch=$(basename ${GITHUB_REF_NAME})" >> $GITHUB_OUTPUT
        id: extract_branch
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ steps.extract_branch.outputs.branch }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./.go-version
      - run: make tools
      - run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH || $$GOPATH)/bin v1.64.6
      - run: make pr-check
        env:
          ARM_TEST_LOCATION: ${{ secrets.ARM_TEST_LOCATION }}
          ARM_TEST_LOCATION_ALT: ${{ secrets.ARM_TEST_LOCATION_ALT }}
          ARM_TEST_LOCATION_ALT2: ${{ secrets.ARM_TEST_LOCATION_ALT2 }}
